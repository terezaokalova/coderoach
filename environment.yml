name: axohack
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - numpy
  - pandas
  - pyarrow
  - zarr>=3
  - numcodecs
  - fsspec
  - aiohttp
  - matplotlib
  - scipy
  - ipykernel
  - jupyterlab
  - pyyaml
  - black
  - ruff
  - pytest
  - pip:
      - bleak>=1.1,<4
      - opencv-contrib-python>=5,<6
      - fastapi>=0.115,<1
      - uvicorn[standard]>=0.30,<1
      # voice/ imports both at module scope. They were installed by hand and
      # never recorded here, so a fresh env could not run the voice path.
      - sounddevice>=0.5,<1
      - faster-whisper>=1.2,<2
      # Startup banner only: the LAN URL as a QR the iPad camera can scan.
      - qrcode>=8,<9
