data:
  info_yaml: data_info.yaml
  sessions:
    - SD11_rec_20260817_153507.zarr
    - SD11_rec_20260820_182314.zarr
    - SD11_rec_20260820_182553.zarr  # first half train/val, second half test
  camera: cam0
  frame_width: 1280
  frame_height: 1024
  likelihood_threshold: 0.3
  bin_ms: 20.0
  window_s: 2.0
  cache_dir: .cache/pose_decoder

split:
  protocol: session  # temporal | session
  # Same-session: first half of test_sessions is train/val, second half is test.
  # Add ids under train_sessions to mix in other recordings.
  train_frac: 0.85
  val_frac: 0.15
  test_frac: 0.0
  guard_s: 2.0
  train_sessions: []
  val_sessions: []
  test_sessions:
    - SD11_rec_20260820_182553.zarr

model:
  in_channels: 32
  hidden_channels: 64
  kernel_size: 10
  stride: 1
  n_layers: 3
  dilations: [1, 2, 4]
  dropout: 0.2
  n_keypoints: 15
  coords: 2
  head: class  # pose | class; class is one arena-grid label per 2s window
  grid_x: 4
  grid_y: 4

train:
  seed: 0
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 1e-2
  max_epochs: 50
  early_stop_patience: 20
  num_workers: 0
  device: auto  # auto | cpu | cuda | mps
  checkpoint_dir: checkpoints/pose_decoder
  time_shift_bins: 25  # ~0.5 s control at 20 ms bins
  adv_weight: 0.0
